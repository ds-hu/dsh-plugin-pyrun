<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Python Run">
  <!-- Original artwork: the Python prompt `>>>` — the shape a Python session
       makes — on the dark tile the sibling plugins use. The last chevron is
       Python yellow: the press that runs the snippet.
       The Plugins page reads this file from package.json's `icon` field and
       embeds it as a data URL (app-boot readPluginMeta): keep it a relative
       path inside this directory, SVG/PNG/JPEG/WebP, at most 256 KiB. -->
  <defs>
    <linearGradient id="pyrun-tile" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1A2B"/>
      <stop offset="0.55" stop-color="#16345A"/>
      <stop offset="1" stop-color="#2A64C9"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#pyrun-tile)"/>
  <path d="M14 21L25 32L14 43" fill="none" stroke="#6F9BFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27 21L38 32L27 43" fill="none" stroke="#A6C3FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 21L51 32L40 43" fill="none" stroke="#FFD84D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
