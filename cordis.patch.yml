# Loader rows this package contributes when installed as a bundle:
#   dsh plugin --profile web add @ds-hu/dsh-plugin-pyrun
# The row name is the specifier the Loader imports, so it must equal the
# package.json name verbatim. A stale bare name keeps booting while an old
# node_modules/<old-name> link survives, then drops the plugin from the next
# start (`skipping profile bundle`) with no error that points back here.
- insert:
    - id: '@ds-hu/dsh-plugin-pyrun'
      name: '@ds-hu/dsh-plugin-pyrun'
